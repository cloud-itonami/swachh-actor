name: ci

# This project is a west project in the com-junkawasaki/root superproject; its
# deps reference sibling repos via :local/root (../../kotoba-lang/langgraph,
# .../langchain). Those two are PUBLIC, so the test job reconstructs the
# workspace layout by checking them out into the expected relative paths —
# no token needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: clj-kondo (errors fail the build)
        run: clojure -M:lint

  test:
    runs-on: ubuntu-latest
    steps:
      # lay the west workspace out so ../../kotoba-lang/* resolves
      - uses: actions/checkout@v4
        with: { path: orgs/etzhayyim/com-etzhayyim-swachh-actor }
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langgraph
          path: orgs/kotoba-lang/langgraph
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/langchain
          path: orgs/kotoba-lang/langchain
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.0
        with: { cli: latest }
      - name: test (governor contract · store parity · LLM advisor · phases)
        working-directory: orgs/etzhayyim/com-etzhayyim-swachh-actor
        run: clojure -M:dev:test
